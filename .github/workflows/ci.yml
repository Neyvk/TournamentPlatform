name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TournamentPlatform.slnx

      - name: Build solution
        run: dotnet build TournamentPlatform.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TournamentPlatform.slnx --configuration Release --no-build --no-restore
