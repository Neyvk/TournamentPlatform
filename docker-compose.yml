services:
  gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__identity__Destinations__local__Address: http://identity:8080/
      ReverseProxy__Clusters__players__Destinations__local__Address: http://players:8080/
      ReverseProxy__Clusters__tournaments__Destinations__local__Address: http://tournaments:8080/
      ReverseProxy__Clusters__matches__Destinations__local__Address: http://matches:8080/
      ReverseProxy__Clusters__rating__Destinations__local__Address: http://rating:8080/
    depends_on:
      - identity
      - players
      - tournaments
      - matches
      - rating

  identity:
    build:
      context: .
      dockerfile: src/IdentityService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=tournament_identity;Username=tournament;Password=tournament_dev
      Jwt__Key: local-development-only-signing-key-not-for-production-12345
      PlayersService__BaseUrl: http://players:8080/
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  players:
    build:
      context: .
      dockerfile: src/PlayersService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Players: Host=postgres;Port=5432;Database=tournament_players;Username=tournament;Password=tournament_dev
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  tournaments:
    build:
      context: .
      dockerfile: src/TournamentsService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"

  matches:
    build:
      context: .
      dockerfile: src/MatchesService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"

  rating:
    build:
      context: .
      dockerfile: src/RatingService/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    expose:
      - "8080"

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: tournament_identity
      POSTGRES_USER: tournament
      POSTGRES_PASSWORD: tournament_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournament -d tournament_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: tournament
      RABBITMQ_DEFAULT_PASS: tournament_dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
